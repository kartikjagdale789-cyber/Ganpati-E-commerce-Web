<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#b45309" />
    <meta name="description" content="Ganpati Inventory & Billing Management System" />
    <title>🙏 Shri Ganesh Murti Bhandar</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { overflow-x: hidden; width: 100%; }
      body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #fafaf8; }
      #root { min-height: 100vh; overflow-x: hidden; }
      img { max-width: 100%; height: auto; }

      /* Chrome, Edge, Safari */
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      /* Firefox */
      input[type="number"] {
        -moz-appearance: textfield;
        appearance: textfield;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
